name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit test

  oauth-real-providers:
    # Validate integration using the actual optional League provider classes
    # without sending requests to Google/Facebook or requiring live secrets.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install optional OAuth provider libraries for integration tests
        run: |
          composer require --dev --no-interaction --prefer-dist --no-progress \
            'league/oauth2-google:^4.0' \
            'league/oauth2-facebook:^2.0' \
            'guzzlehttp/guzzle:^7.0'

      - name: Assert real OAuth providers are available
        run: |
          php -r 'require "vendor/autoload.php"; exit(
            class_exists("League\\OAuth2\\Client\\Provider\\Google") &&
            class_exists("League\\OAuth2\\Client\\Provider\\Facebook") ? 0 : 1
          );'

      - name: Run real-provider OAuth integration tests
        run: vendor/bin/phpunit test/RealOAuthProviderTest.php

  migrations-postgresql:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: auth_test
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run bundled Phinx migrations
        run: vendor/bin/phinx migrate --configuration test/phinx.php --environment testing

      - name: Verify migration status
        run: vendor/bin/phinx status --configuration test/phinx.php --environment testing

      - name: Verify migrated schema
        run: php test/verify_migrations.php

      - name: Verify portable role lookup
        run: php test/verify_postgresql_role_lookup.php
